<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="980" viewBox="0 0 1700 980" role="img" aria-labelledby="title desc">
  <title id="title">Journie LLM Collaboration Pipeline</title>
  <desc id="desc">A readable diagram showing how the Tag LLM, Memory LLM, and Writer LLM collaborate in Journie.</desc>

  <defs>
    <style>
      .bg { fill: #fbfdff; }
      .llm { fill: #78c9f0; stroke: #2d6f92; stroke-width: 2.5; }
      .info { fill: #ffffff; stroke: #9ecae1; stroke-width: 2; }
      .note { fill: #f7fbff; stroke: #d0e3ef; stroke-width: 1.5; }
      .title { fill: #102938; font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; }
      .boxTitle { fill: #102938; font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; }
      .boxSub { fill: #17384c; font-family: Arial, Helvetica, sans-serif; font-size: 20px; }
      .body { fill: #17384c; font-family: Arial, Helvetica, sans-serif; font-size: 18px; }
      .small { fill: #17384c; font-family: Arial, Helvetica, sans-serif; font-size: 17px; }
      .label { fill: #111; font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; }
      .arrow { stroke: #111; stroke-width: 5; fill: none; marker-end: url(#arrowhead); }
      .curve { stroke: #111; stroke-width: 5; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 11 4, 0 8" fill="#111" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1700" height="980" />

  <text class="title" x="850" y="58" text-anchor="middle">Journie LLM Collaboration Pipeline</text>

  <rect class="llm" x="90" y="110" width="320" height="120" rx="18" />
  <text class="boxTitle" x="250" y="152" text-anchor="middle">Tag LLM</text>
  <text class="boxSub" x="250" y="186" text-anchor="middle">QWEN 2.5 Flash</text>
  <text class="boxSub" x="250" y="214" text-anchor="middle">post context generator</text>

  <rect class="llm" x="690" y="110" width="320" height="120" rx="18" />
  <text class="boxTitle" x="850" y="152" text-anchor="middle">Memory LLM</text>
  <text class="boxSub" x="850" y="186" text-anchor="middle">QWEN 3.5</text>
  <text class="boxSub" x="850" y="214" text-anchor="middle">long-term user memory</text>

  <rect class="llm" x="1290" y="110" width="320" height="120" rx="18" />
  <text class="boxTitle" x="1450" y="152" text-anchor="middle">Writer LLM</text>
  <text class="boxSub" x="1450" y="186" text-anchor="middle">gpt-4o</text>
  <text class="boxSub" x="1450" y="214" text-anchor="middle">journal + insight writer</text>

  <path class="arrow" d="M410 170 H690" />
  <path class="curve" d="M1010 150 C1135 75, 1225 75, 1290 145" />
  <text class="label" x="1160" y="76" text-anchor="middle">retrieves vital data</text>

  <rect class="info" x="55" y="295" width="390" height="395" rx="18" />
  <text class="boxTitle" x="250" y="334" text-anchor="middle">Post Context Output</text>
  <text class="body" x="250" y="372" text-anchor="middle">Uses the schema from supabase migration 002</text>
  <text class="body" x="250" y="416" text-anchor="middle">moment_tags</text>
  <text class="small" x="250" y="446" text-anchor="middle">activity, location, food, social, mood</text>
  <text class="small" x="250" y="474" text-anchor="middle">object, event, hobby, work, health</text>
  <text class="body" x="250" y="525" text-anchor="middle">daily_tag_summaries</text>
  <text class="small" x="250" y="555" text-anchor="middle">top_tags</text>
  <text class="small" x="250" y="583" text-anchor="middle">tag_counts</text>
  <text class="small" x="250" y="634" text-anchor="middle">This gives the writer and memory layer</text>
  <text class="small" x="250" y="662" text-anchor="middle">structured context for that post/day.</text>

  <rect class="info" x="655" y="295" width="390" height="300" rx="18" />
  <text class="boxTitle" x="850" y="334" text-anchor="middle">Memory Decision Logic</text>
  <text class="body" x="850" y="382" text-anchor="middle">What changed?</text>
  <text class="body" x="850" y="414" text-anchor="middle">What matters long-term?</text>
  <text class="body" x="850" y="446" text-anchor="middle">What determines user behavior?</text>
  <text class="small" x="850" y="500" text-anchor="middle">Stores durable knowledge as:</text>
  <text class="small" x="850" y="530" text-anchor="middle">preference, relationship, routine,</text>
  <text class="small" x="850" y="558" text-anchor="middle">identity, voice</text>

  <rect class="info" x="1255" y="295" width="390" height="300" rx="18" />
  <text class="boxTitle" x="1450" y="334" text-anchor="middle">Writer Inputs</text>
  <text class="body" x="1450" y="382" text-anchor="middle">images</text>
  <text class="body" x="1450" y="414" text-anchor="middle">persona</text>
  <text class="body" x="1450" y="446" text-anchor="middle">stored memories</text>
  <text class="body" x="1450" y="478" text-anchor="middle">caption</text>
  <text class="small" x="1450" y="516" text-anchor="middle">text_context + voice_transcript</text>

  <rect class="note" x="1295" y="670" width="310" height="115" rx="18" />
  <text class="boxTitle" x="1450" y="714" text-anchor="middle">Writer Output</text>
  <text class="body" x="1450" y="748" text-anchor="middle">hidden insights</text>

  <path class="arrow" d="M1450 230 V295" />
  <path class="arrow" d="M1450 595 V670" />

  <path class="curve" d="M1355 785 C1235 910, 945 910, 875 610" />
  <text class="label" x="1120" y="892" text-anchor="middle">updates memory as needed</text>

  <rect class="note" x="620" y="735" width="460" height="140" rx="18" />
  <text class="boxTitle" x="850" y="778" text-anchor="middle">Collaboration Summary</text>
  <text class="small" x="850" y="814" text-anchor="middle">Tag LLM creates structured post context.</text>
  <text class="small" x="850" y="842" text-anchor="middle">Memory LLM decides what should be kept long-term.</text>
  <text class="small" x="850" y="870" text-anchor="middle">Writer uses images, persona, memories, and caption text to write.</text>
</svg>
